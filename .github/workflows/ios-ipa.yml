name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/build-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Zenvu-ipa
          path: build/Zenvu.ipa
          retention-days: 30
